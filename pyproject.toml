[project]
name = "strands-agent"
version = "0.1.0"
description = "Strands Agent + Ollama: General-purpose coding agent"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.0.0",
    "python-dotenv>=1.0.0",
    "strands-agents-tools>=0.8.6",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
agent = "strands_poc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_poc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",  # fullwidth characters in Chinese prompts
    "RUF002",  # fullwidth characters in Chinese comments
    "RUF003",  # fullwidth characters in Chinese docstrings
]

[tool.ruff.lint.per-file-ignores]
# Test / demo scripts insert the src path into sys.path BEFORE importing
# project modules — the import-after-code pattern is intentional there.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
