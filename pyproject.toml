[project]
name = "strands-agent"
version = "0.1.0"
description = "Strands Agents SDK + Ollama Qwen3.8 Agent Harness (PoC)"
requires-python = ">=3.12"
dependencies = [
    "strands-agents[ollama]>=1.0.0",
    "python-dotenv>=1.0.0",
    "strands-agents-tools>=0.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_poc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",  # fullwidth characters in Chinese prompts
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
